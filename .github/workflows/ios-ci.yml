name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner_target:
        description: Use the Mac by default; hosted is a manual fallback and needs available GitHub allowance
        type: choice
        options: [self-hosted, hosted]
        default: self-hosted
      run_maestro:
        description: Run the four locking journeys after deterministic, StoreKit, upgrade and Release checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schedule-tests:
    # Keep the existing required-check name stable.
    name: Schedule, unlock/recovery, upgrade tests and Release build
    # Only trusted, same-repository PRs may execute on the owner's Mac.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner_target == 'hosted' && '["macos-26"]' || '["self-hosted","macOS","ARM64","docard-ios"]') }}
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target == 'hosted' && format('docard-hosted-core-{0}', github.run_id) || 'docard-ios-self-hosted' }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      CI_JOB_STAGE: core
      DOCARD_CI_XCODE_PATH: ${{ vars.DOCARD_CI_XCODE_PATH }}
      CI_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check runner, Xcode and simulator runtime
        env:
          DOCARD_RUNNER_KIND: ${{ runner.environment }}
        run: bash ci/prepare-ios-runner.sh

      - name: Verify runner configuration guards
        run: python3 ci/test-runner-config.py

      - name: Verify CI result gates
        run: python3 ci/test-ios-ci.py

      - name: Run deterministic, StoreKit and upgrade checks, then build Release
        run: caffeinate -i bash ci/run-ios-ci.sh

      - name: Package the tested Debug simulator app
        if: github.event_name == 'workflow_dispatch' && inputs.run_maestro
        run: |
          bash ci/package-maestro-app.sh \
            "$CI_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/DoCard.app" \
            "$MAESTRO_APP_DIR"

      - name: Upload simulator app for Maestro
        if: github.event_name == 'workflow_dispatch' && inputs.run_maestro
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-debug-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MAESTRO_APP_DIR }}/
          retention-days: 1
          if-no-files-found: error

      - name: Write result summary
        if: always()
        run: python3 ci/ios-ci-summary.py "$CI_RESULTS_DIR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and Xcode results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS_DIR }}
          retention-days: 7
          if-no-files-found: warn

  maestro-smoke:
    name: Maestro locking journeys (manual rollout)
    needs: schedule-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_maestro
    runs-on: ${{ fromJSON(inputs.runner_target == 'hosted' && '["macos-26"]' || '["self-hosted","macOS","ARM64","docard-ios"]') }}
    concurrency:
      group: ${{ inputs.runner_target == 'hosted' && format('docard-hosted-maestro-{0}', github.run_id) || 'docard-ios-self-hosted' }}
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      CI_JOB_STAGE: maestro
      DOCARD_CI_XCODE_PATH: ${{ vars.DOCARD_CI_XCODE_PATH }}
      CI_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check runner, Xcode and simulator runtime
        env:
          DOCARD_RUNNER_KIND: ${{ runner.environment }}
        run: bash ci/prepare-ios-runner.sh

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the tested simulator app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maestro-debug-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MAESTRO_APP_DIR }}

      - name: Check architecture and unpack app
        run: |
          test "$(cat "$MAESTRO_APP_DIR/build-architecture.txt")" = "$(uname -m)"
          ditto -x -k "$MAESTRO_APP_DIR/DoCard.app.zip" "$MAESTRO_APP_DIR"

      - name: Install pinned Maestro CLI
        run: bash ci/install-maestro.sh "$RUNNER_TEMP/maestro-tools"

      - name: Verify smoke result gate
        run: python3 ci/test-maestro-results.py

      - name: Run four locking journeys
        run: >-
          caffeinate -i python3 ci/run-maestro.py --app "$MAESTRO_APP_DIR/DoCard.app"
          --results "$CI_RESULTS_DIR"

      - name: Write smoke summary
        if: always()
        run: |
          if test -f "$CI_RESULTS_DIR/maestro-passed"; then
            echo 'Maestro: all four locking journeys passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Maestro did not complete all four journeys. Check the logs/artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Maestro reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS_DIR }}/
          retention-days: 7
          if-no-files-found: warn
