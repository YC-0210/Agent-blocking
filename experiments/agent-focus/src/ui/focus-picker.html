<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DO · Focus timeline</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#fff5e6;--fg:#2d281f;--muted:#6b6052;--line:#dcceb9;--accent:#f25b36;--soft:#f7c8af;--error:#8c2c19}
*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg)}main{padding:24px;max-width:850px;margin:auto}.duration{display:flex;gap:12px;align-items:baseline}.duration input{font:inherit;font-size:clamp(48px,8vw,64px);font-weight:800;line-height:1.1;letter-spacing:-3px;width:148px;max-width:60%;appearance:textfield;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);padding:0}.duration input::-webkit-inner-spin-button{appearance:none}.duration label{font-size:14px;color:var(--muted)}.track{position:relative;height:44px;margin:20px 0 16px}.track:before{content:"";position:absolute;left:0;right:0;height:6px;top:19px;background:var(--line);border-radius:6px}.fill{position:absolute;left:0;top:19px;height:6px;border-radius:6px;background:var(--accent);min-width:0}.track input{position:absolute;width:100%;inset:0;height:44px;padding:0;margin:0;appearance:none;background:transparent;border:0;cursor:ew-resize}.track input::-webkit-slider-runnable-track{background:transparent;height:6px}.track input::-webkit-slider-thumb{appearance:none;background:var(--accent);width:28px;height:28px;margin-top:-11px;border:4px solid var(--bg);border-radius:50%;box-shadow:0 0 0 1px var(--accent)}.track input::-moz-range-track{background:transparent;height:6px}.track input::-moz-range-thumb{background:var(--accent);border:4px solid var(--bg);height:20px;width:20px;border-radius:50%;box-shadow:0 0 0 1px var(--accent)}.actions{display:flex;justify-content:flex-end}.primary{border:0;background:var(--accent);color:var(--fg);border-radius:8px;padding:12px 18px;min-height:44px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}button:disabled,input:disabled{opacity:.6;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:5px}.status,.error{font-size:13px;line-height:1.65;margin:16px 0 0;overflow-wrap:anywhere}.error{color:var(--error)}[hidden]{display:none!important}
@media(max-width:360px){main{padding:20px}.duration input{font-size:52px;width:140px}.duration label{font-size:13px}}
@media(forced-colors:active){.track:before,.fill{background:CanvasText}.track input{appearance:auto}.primary{border:1px solid ButtonText}.track input::-webkit-slider-thumb{box-shadow:none}}
</style></head><body><main aria-busy="true">
<section id="picker" hidden>
<div class="duration"><input type="number" id="minutes" aria-label="Duration in minutes"><label for="minutes">minutes</label></div>
<div class="track"><div class="fill" id="fill"></div><input type="range" id="timeline" aria-label="Drag to choose duration"></div>
<div class="actions"><button class="primary" id="confirm" disabled>Confirm</button></div>
<div class="status" id="status" role="status" hidden></div>
</section><p class="error" id="error" role="alert" hidden></p>
</main><script>__FOCUS_APP_JS__</script></body></html>
