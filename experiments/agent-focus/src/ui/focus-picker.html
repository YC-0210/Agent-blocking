<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DO · Focus timeline</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;--bg:#f5f5ee;--fg:#253129;--muted:#6b786b;--line:#d8ddd1;--accent:#254f3c;--soft:#d5e2c7;--error:#a44828;--panel:#fff}*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg)}main{padding:25px 28px 23px;max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px}.brand b{padding:5px 7px;background:var(--accent);color:var(--bg);border-radius:6px}.tag{font-size:10px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}.eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}h1{font-family:Georgia,serif;font-weight:400;font-size:32px;letter-spacing:-.8px;margin:0 0 10px;line-height:1.2}.description{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 22px;max-width:640px}.numbers{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid var(--line);padding-top:20px}.duration{display:flex;gap:8px;align-items:baseline}.duration input{font:inherit;font-size:38px;letter-spacing:-1.5px;width:103px;appearance:textfield;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);padding:2px 0}.duration input::-webkit-inner-spin-button{appearance:none}.duration label{color:var(--muted);font-size:12px}.end{text-align:right;font-size:12px;line-height:1.8}.end span{display:block;color:var(--muted);font-size:10px}.track{position:relative;background:var(--line);height:58px;border-radius:9px;margin-top:24px;overflow:visible}.fill{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--soft);border-right:2px solid var(--accent);min-width:2px}.track-label{position:absolute;top:14px;left:12px;font-size:11px;pointer-events:none;white-space:nowrap}.track-label small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.track input{position:absolute;width:100%;inset:0;height:58px;padding:0;margin:0;appearance:none;background:transparent;border:0;cursor:ew-resize}.track input::-webkit-slider-runnable-track{background:transparent}.track input::-webkit-slider-thumb{appearance:none;background:var(--accent);width:16px;height:74px;border:4px solid var(--bg);border-radius:12px;box-shadow:0 0 0 1px var(--accent)}.track input::-moz-range-thumb{background:var(--accent);border:3px solid var(--bg);height:68px;width:8px;border-radius:8px}.scale-control{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--muted);font-size:10px;margin-top:18px}.scale-control select{font:inherit;font-size:11px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.ticks{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:10px}.presets{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.presets button{font-size:11px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--fg)}.presets button[aria-pressed=true]{background:var(--soft);border-color:#9cb488}.summary{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px;font-size:11px;line-height:1.7;color:var(--muted)}.summary strong{color:var(--fg);font-weight:550}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px}.note{font-size:11px;line-height:1.6;color:var(--muted);max-width:340px}.primary{border:1px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:9px;padding:12px 18px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}button:disabled,input:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid #648cdd;outline-offset:4px}.status{font-size:12px;line-height:1.65;padding:13px 15px;border-radius:8px;background:var(--soft);margin:16px 0 0}.error{color:var(--error);font-size:12px;line-height:1.6;margin:12px 0 0}.observed{font-size:10px;color:var(--muted);margin-top:15px;line-height:1.5}.muted{color:var(--muted)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#191e1a;--fg:#e4eddf;--muted:#a5b49f;--line:#354331;--accent:#c5dda9;--soft:#374d2f;--error:#f4b7a2;--panel:#242b23}}@media(max-width:500px){main{padding:20px}h1{font-size:29px}.actions{flex-direction:column;align-items:stretch}.note{max-width:none}.primary{width:100%}.duration input{font-size:34px;width:90px}.tag{font-size:8px}.numbers{gap:8px}}
</style></head><body><main aria-busy="true">
<header><div class="brand"><b>DO</b> Focus</div><span class="tag" id="kind">Connecting</span></header>
<p class="eyebrow" id="context">Your agent’s proposal</p><h1 id="title">Choose your focus window.</h1>
<p class="description" id="description">Waiting for the proposal from your agent…</p>
<section id="picker" hidden>
<div class="numbers"><div class="duration"><input type="number" id="minutes" aria-label="Duration in minutes"><label for="minutes">minutes</label></div><div class="end" id="end"></div></div>
<label class="scale-control" id="scale-control" hidden>Timeline range<select id="scale" aria-label="Maximum timeline range"><option value="180">3 hours</option><option value="360">6 hours</option><option value="720">12 hours</option><option value="1440">24 hours</option></select></label>
<div class="track"><div class="fill" id="fill"></div><div class="track-label" id="track-label"></div><input type="range" id="timeline" aria-label="Drag to choose duration"></div>
<div class="ticks" id="ticks"></div><div class="presets" id="presets"></div>
<div class="summary" id="summary"></div>
<div class="actions"><span class="note" id="note"></span><button class="primary" id="confirm" disabled>Confirm</button></div>
<div class="status" id="status" role="status" hidden></div><p class="observed" id="observed"></p>
</section><p class="error" id="error" role="alert" hidden></p>
</main><script>__FOCUS_APP_JS__</script></body></html>
