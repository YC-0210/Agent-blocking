<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DO · Focus timeline</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f5f5ee;--fg:#253129;--muted:#6b786b;--line:#d8ddd1;--accent:#254f3c;--soft:#d5e2c7;--error:#a44828}*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg)}main{padding:24px;max-width:850px;margin:auto}.duration{display:flex;gap:10px;align-items:baseline}.duration input{font:inherit;font-size:44px;letter-spacing:-1.5px;width:120px;appearance:textfield;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);padding:0}.duration input::-webkit-inner-spin-button{appearance:none}.duration label{font-size:14px;color:var(--muted)}.track{position:relative;background:var(--line);height:58px;border-radius:9px;margin:30px 0 24px}.fill{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--soft);min-width:2px}.track input{position:absolute;width:100%;inset:0;height:58px;padding:0;margin:0;appearance:none;background:transparent;border:0;cursor:ew-resize}.track input::-webkit-slider-runnable-track{background:transparent}.track input::-webkit-slider-thumb{appearance:none;background:var(--accent);width:16px;height:74px;border:4px solid var(--bg);border-radius:12px;box-shadow:0 0 0 1px var(--accent)}.track input::-moz-range-thumb{background:var(--accent);border:3px solid var(--bg);height:68px;width:8px;border-radius:8px}.actions{display:flex;justify-content:flex-end}.primary{border:0;background:var(--accent);color:var(--bg);border-radius:8px;padding:9px 16px;font:inherit;font-size:13px;cursor:pointer}button:disabled,input:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid #648cdd;outline-offset:4px}.status,.error{font-size:12px;line-height:1.6;margin:14px 0 0}.error{color:var(--error)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#191e1a;--fg:#e4eddf;--muted:#a5b49f;--line:#354331;--accent:#c5dda9;--soft:#374d2f;--error:#f4b7a2}}
</style></head><body><main aria-busy="true">
<section id="picker" hidden>
<div class="duration"><input type="number" id="minutes" aria-label="Duration in minutes"><label for="minutes">minutes</label></div>
<div class="track"><div class="fill" id="fill"></div><input type="range" id="timeline" aria-label="Drag to choose duration"></div>
<div class="actions"><button class="primary" id="confirm" disabled>Confirm</button></div>
<div class="status" id="status" role="status" hidden></div>
</section><p class="error" id="error" role="alert" hidden></p>
</main><script>__FOCUS_APP_JS__</script></body></html>
