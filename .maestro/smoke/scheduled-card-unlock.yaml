appId: online.do.card.app
name: scheduled-card-unlock
---
- runFlow: ../helpers/scheduled-start.yaml
- longPressOn:
    id: focus.stop
- assertVisible:
    id: journey.scan
    text: "pending"
- tapOn:
    id: journey.card
- assertVisible:
    id: journey.state
    text: "idle"
- assertVisible:
    id: focus.start
- assertVisible:
    id: journey.shield
    text: "Simulated hardware · off"
- assertVisible:
    id: journey.history
    text: "saved=1;reason=card_tap;source=scheduled;audits=0"
- tapOn:
    id: journey.clock.15
- assertVisible:
    id: journey.state
    text: "idle"
- assertVisible:
    id: focus.start
- assertVisible:
    id: journey.shield
    text: "Simulated hardware · off"
- assertVisible:
    id: journey.safety
    text: "quota=3;reblocks=0"
- launchApp:
    arguments:
      docardUITestScenario: scheduled
      docardUITestReset: "false"
      AppleLanguages: "(zh-Hant)"
      AppleLocale: zh_TW
- assertVisible:
    id: focus.start
- assertVisible:
    id: journey.state
    text: "idle"
- assertVisible:
    id: focus.start
- assertVisible:
    id: journey.shield
    text: "Simulated hardware · off"
- assertVisible:
    id: journey.history
    text: "saved=1;reason=card_tap;source=scheduled;audits=0"
- assertVisible:
    id: journey.safety
    text: "quota=3;reblocks=0"
- takeScreenshot: scheduled-early-unlock
